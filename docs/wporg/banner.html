<!doctype html>
<html><head><meta charset="utf-8"><title>Banner</title>
<style>
	html, body { margin: 0; }
	body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; }
	.banner { position: relative; overflow: hidden; width: 772px; height: 250px; color: #fff;
		background: linear-gradient(120deg, #0b524d 0%, #0f766e 55%, #14a08f 100%); }
	.glow { position: absolute; border-radius: 50%; background: #fff; opacity: .06; }
	.text { position: absolute; left: 48px; top: 44px; width: 400px; }
	.brand { display: flex; align-items: center; gap: 12px; font-size: 17px; font-weight: 600; }
	.brand svg { width: 38px; height: 38px; }
	h1 { margin: 22px 0 0; font-size: 32px; line-height: 1.15; font-weight: 700; letter-spacing: -.01em; }
	p { margin: 16px 0 0; font-size: 13.5px; opacity: .9; }
	.card { position: absolute; right: 52px; top: 34px; width: 238px; padding: 16px 18px; border-radius: 14px;
		background: #fff; color: #1d2327; box-shadow: 0 16px 40px rgba(0,0,0,.22); }
	.label { font-size: 11px; color: #55606a; }
	.num { display: flex; align-items: baseline; gap: 8px; margin-top: 2px; font-size: 24px; font-weight: 700; }
	.up { font-size: 11px; font-weight: 600; color: #107a4c; }
	.bars { display: flex; align-items: flex-end; gap: 4px; height: 46px; margin: 10px 0 10px; }
	.bars i { flex: 1; border-radius: 2px 2px 0 0; background: #14857a; }
	.row { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; font-size: 11px; }
	.row b { font-family: ui-monospace, Menlo, monospace; font-weight: 400; }
	.row span { font-weight: 600; }
	.track { height: 5px; margin-top: 3px; border-radius: 3px; background: #edf1f0; }
	.track i { display: block; height: 100%; border-radius: 3px; background: #14857a; }
</style></head>
<body>
<div class="banner">
	<div class="glow" style="width:420px;height:420px;right:-120px;top:-170px"></div>
	<div class="glow" style="width:260px;height:260px;right:150px;top:150px"></div>
	<div class="text">
		<div class="brand">
			<svg viewBox="0 0 256 256"><rect width="256" height="256" rx="56" fill="#fff" fill-opacity=".16"/><rect x="58" y="120" width="34" height="74" rx="9" fill="#fff" fill-opacity=".7"/><rect x="111" y="62" width="34" height="132" rx="9" fill="#fff"/><rect x="164" y="98" width="34" height="96" rx="9" fill="#fff" fill-opacity=".85"/><rect x="46" y="202" width="164" height="10" rx="5" fill="#fff" fill-opacity=".55"/></svg>
			NHR Post Insights
		</div>
		<h1>See which posts get read, and for how long</h1>
		<p>Views · Time on post · Referrers · No cookies</p>
	</div>
	<div class="card">
		<div class="label">Views, last 30 days</div>
		<div class="num">12,059 <span class="up">↑ 24%</span></div>
		<div class="bars">
			<i style="height:45%"></i><i style="height:70%"></i><i style="height:62%"></i><i style="height:58%"></i><i style="height:68%"></i><i style="height:52%"></i><i style="height:66%"></i><i style="height:72%"></i><i style="height:88%"></i><i style="height:74%"></i><i style="height:64%"></i><i style="height:44%"></i><i style="height:70%"></i><i style="height:100%"></i><i style="height:80%"></i><i style="height:52%"></i><i style="height:78%"></i>
		</div>
		<div class="row"><b>google.com</b><span>40%</span></div>
		<div class="track"><i style="width:80%"></i></div>
		<div class="row"><b>linkedin.com</b><span>9%</span></div>
		<div class="track"><i style="width:22%"></i></div>
	</div>
</div>
</body></html>
