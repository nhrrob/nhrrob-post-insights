<!doctype html>
<html><head><meta charset="utf-8"><title>Icon</title>
<style>
	html, body { margin: 0; background: transparent; }
	.icon { width: 256px; height: 256px; }
</style></head>
<body>
<!-- The app bar's chart icon as solid bars on the plugin's teal. -->
<svg class="icon" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
	<defs>
		<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#0d5c56"/>
			<stop offset="1" stop-color="#14a08f"/>
		</linearGradient>
	</defs>
	<rect width="256" height="256" rx="48" fill="url(#bg)"/>
	<rect x="58" y="120" width="34" height="74" rx="9" fill="#fff" fill-opacity="0.7"/>
	<rect x="111" y="62" width="34" height="132" rx="9" fill="#fff"/>
	<rect x="164" y="98" width="34" height="96" rx="9" fill="#fff" fill-opacity="0.85"/>
	<rect x="46" y="202" width="164" height="10" rx="5" fill="#fff" fill-opacity="0.55"/>
</svg>
</body></html>
