name: Release

# When the plugin's Version changes on main, tag v<version> and make a GitHub
# release with that version's changelog from readme.txt. The blog installs
# the plugin from these tags with Composer.
#
# The same run sends the release to WordPress.org (SVN), once the SVN_USERNAME
# and SVN_PASSWORD secrets are set. A push that changes only readme.txt or
# .wordpress-org/ updates the listing without a release. Run the workflow by
# hand to send the current version to WordPress.org again (the first time, after
# the plugin is approved).
on:
  push:
    branches: [ "main" ]
    paths: [ "nhrrob-post-insights.php", "readme.txt", ".wordpress-org/**", ".github/workflows/release.yml" ]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
      SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}

    steps:
    - uses: actions/checkout@v4

    - name: Tag and release the version
      id: release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        version=$(sed -n 's/^ \* Version: *//p' nhrrob-post-insights.php)

        if [ -z "$version" ]; then
          echo "::error::No Version found in the nhrrob-post-insights.php header."
          exit 1
        fi

        echo "version=$version" >> "$GITHUB_OUTPUT"

        if gh release view "v$version" >/dev/null 2>&1; then
          echo "v$version is already released."
          echo "new=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # The notes are this version's lines under "== Changelog ==" in readme.txt.
        awk -v version="$version" '/^= /{ found = ( $2 == version ); next } /^== /{ found = 0 } found' readme.txt > release-notes.md
        gh release create "v$version" --target "$GITHUB_SHA" --title "v$version" --notes-file release-notes.md
        echo "new=true" >> "$GITHUB_OUTPUT"

    - name: Production autoloader (no dev packages)
      if: env.SVN_USERNAME != ''
      run: composer install --no-dev --no-interaction --optimize-autoloader

    - name: Send the version to WordPress.org
      if: env.SVN_USERNAME != '' && ( steps.release.outputs.new == 'true' || github.event_name == 'workflow_dispatch' )
      uses: 10up/action-wordpress-plugin-deploy@stable
      env:
        SLUG: nhrrob-post-insights
        VERSION: ${{ steps.release.outputs.version }}

    - name: Update the readme and assets on WordPress.org
      if: env.SVN_USERNAME != '' && steps.release.outputs.new == 'false' && github.event_name == 'push'
      uses: 10up/action-wordpress-plugin-asset-update@stable
      env:
        SLUG: nhrrob-post-insights
        IGNORE_OTHER_FILES: true
